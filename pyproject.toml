[project]
name = "calico-pet"
version = "0.1.0"
description = "A small, transparent desktop calico cat pet for Windows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
calico-pet = "calico_pet.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calico_pet"]

